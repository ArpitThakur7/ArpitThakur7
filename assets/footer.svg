<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="160" viewBox="0 0 1280 160" role="img" aria-label="Thanks for listening">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD58A" stop-opacity=".3"/><stop offset="1" stop-color="#F2A93B" stop-opacity="0"/></linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B0F17"/><stop offset="1" stop-color="#151B26"/></linearGradient>
  </defs>
  <rect width="1280" height="160" rx="20" fill="url(#bg)"/>
  <polygon points="620,0 660,0 760,160 520,160" fill="url(#b)"><animate attributeName="opacity" values="1;.8;1" dur="4s" repeatCount="indefinite"/></polygon>
  <text x="640" y="86" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#ECE6DA">Thanks for listening</text>
  <text x="640" y="116" text-anchor="middle" font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" fill="#9AA3AF">Star a repo if something here helped you</text>
  <rect width="1280" height="160" rx="20" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="2"/>
</svg>